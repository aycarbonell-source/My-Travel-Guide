        .menu {
            display: flex;
            justify-content: center;

            padding: 20px;
            border-radius: 4px;

        }
        .menu-wrapper {
            position: relative;
            display: inline-block;
        }
        .menu a {
            background-color: #f5e9d0;
            color: black;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s;
            display: inline-block;
        }
        .menu a:hover {
            background-color: #F5F0E6;
            color: #d98b55;
        }
        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 180px;
            background-color: #d98b55;
            padding: 8px;
            border-radius: 8px;
            z-index: 10;
            text-align: left;
        }
        .menu-wrapper:hover .submenu {
            display: block;
        }
        .submenu a {
            display: block;
            background-color: #f5e9d0;
            margin: 5px 0;
            border-radius: 5px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .submenu a:hover {
            background-color: white;
            color: black;
            transform: translateX(5px);
        }
    </style>
